name: HISOBIM APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          unzip -q HISOBIM_PREMIUM_V2.zip -d proj
          PROJ=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          cd "$PROJ"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HISOBIM.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HISOBIM-APK
          path: HISOBIM.apk
          if-no-files-found: error
